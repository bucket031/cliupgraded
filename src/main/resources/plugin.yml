name: AbsoluteVoidClock
version: '1.0.0'
main: com.example.absolutevoidclock.AbsoluteVoidClock
api-version: '1.21'
description: The Absolute Void Clock - a soulbound clock with three selectable abilities and its own config menus.
commands:
  absolutevoidclock:
    description: Give the Absolute Void Clock and configure its abilities
    usage: /<command> <give|config|reload|resetcooldown|help>
    aliases: [voidclock, avc]
    permission: absolutevoidclock.admin
permissions:
  absolutevoidclock.admin:
    description: Give the clock, open the config menus, reload, reset cooldowns
    default: op
  absolutevoidclock.use:
    description: Use the Absolute Void Clock abilities
    default: true
